name: Renovate

on:
  schedule:
    # Toutes les heures (le "*" doit être entre guillemets en YAML)
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      logLevel:
        description: Niveau de log de Renovate
        type: choice
        options: [info, debug]
        default: info
      dryRun:
        description: Analyse seule, sans créer de branche ni de PR
        type: choice
        options: ['', lookup, full]
        default: ''
  push:
    branches: [main]
    paths:
      - renovate.json
      - .github/workflows/renovate.yml
  pull_request:
    paths:
      - renovate.json
      - .github/workflows/renovate.yml

concurrency:
  group: renovate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Valider la config Renovate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npx --yes --package renovate@latest -- renovate-config-validator --strict

  renovate:
    name: Analyse des dépendances
    needs: validate
    # Pas d'exécution sur les PR : le secret n'y est pas disponible depuis un fork
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Self-hosted Renovate
        uses: renovatebot/github-action@v46.3.15
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: 'false'
          RENOVATE_DRY_RUN: ${{ inputs.dryRun || '' }}
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
