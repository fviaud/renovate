name: Frontend

# Pas de filtre de chemins : "Lint et build" doit se lancer sur toutes les PR
# pour pouvoir être un check obligatoire de la protection de main.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: frontend

jobs:
  ci:
    name: Lint et build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # Échoue si package.json et package-lock.json ne correspondent pas
      - run: npm ci
      - run: npm run lint
      # Le build Next.js vérifie aussi les types TypeScript
      - run: npm run build
