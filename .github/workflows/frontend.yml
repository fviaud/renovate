name: Frontend

# Pas de filtre de chemins : "Lint et build" doit se lancer sur toutes les PR
# pour pouvoir être un check obligatoire de la protection de main.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: frontend

jobs:
  ci:
    name: Lint et build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # Échoue si package.json et package-lock.json ne correspondent pas
      - run: npm ci
      - run: npm run lint
      # Le build Next.js vérifie aussi les types TypeScript
      - run: npm run build

  docker:
    name: Image Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build de l'image
        run: docker build -t frontend:ci .
      - name: Test de démarrage du conteneur
        run: |
          docker run -d --name frontend -p 3000:3000 frontend:ci
          for i in $(seq 1 30); do
            curl -fs -o /dev/null http://localhost:3000/ && break
            sleep 1
          done
          curl -fsS -o /dev/null -w 'HTTP %{http_code}\n' http://localhost:3000/
      - name: Logs du conteneur
        if: always()
        run: docker logs frontend || true
