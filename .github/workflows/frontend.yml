name: Frontend

# Pas de filtre de chemins : "Lint et build" doit se lancer sur toutes les PR
# pour pouvoir être un check obligatoire de la protection de main.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: frontend

jobs:
  ci:
    name: Lint et build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # Échoue si package.json et package-lock.json ne correspondent pas
      - run: npm ci
      - run: npm run lint
      # Le build Next.js vérifie aussi les types TypeScript
      - run: npm run build

  docker:
    name: Image Docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Publication de l'image sur ghcr.io (uniquement sur main, voir plus bas)
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build de l'image
        # Le label "source" relie le package ghcr.io à ce dépôt.
        # --provenance=false : un seul manifeste par image, sans attestation
        # séparée (qui apparaît comme une version "untagged" sur ghcr.io et
        # casse l'image si on la supprime).
        run: |
          docker build -t frontend:ci --provenance=false \
            --label org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }} \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            .
      - name: Test de démarrage du conteneur
        run: |
          docker run -d --name frontend -p 3000:3000 frontend:ci
          for i in $(seq 1 30); do
            curl -fs -o /dev/null http://localhost:3000/ && break
            sleep 1
          done
          curl -fsS -o /dev/null -w 'HTTP %{http_code}\n' http://localhost:3000/
      - name: Logs du conteneur
        if: always()
        run: docker logs frontend || true
      - name: Publication sur ghcr.io
        # Uniquement après un push sur main : jamais sur les PR (dont Renovate)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/renovate-frontend"
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for TAG in latest "sha-${GITHUB_SHA::7}"; do
            docker tag frontend:ci "$IMAGE:$TAG"
            docker push "$IMAGE:$TAG"
          done
          echo "Image publiée : $IMAGE (tags latest et sha-${GITHUB_SHA::7})" >> "$GITHUB_STEP_SUMMARY"
      - name: Nettoyage des anciennes images sur ghcr.io
        # Garde les 10 versions les plus récentes (dont latest), supprime les plus anciennes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/delete-package-versions@v5
        with:
          package-name: renovate-frontend
          package-type: container
          min-versions-to-keep: 10
